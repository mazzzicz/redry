name: Build REDRY for Minecraft 26.3

on:
  push:
    branches:
      - arena/01a108a8-redry
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Validate assets and metadata
        run: python3 tools/validate_project.py

      - name: Build Fabric mod
        run: gradle --no-daemon clean build

      - name: Verify the packaged mod
        run: python3 -m zipfile -t build/libs/redry-nightfall-0.2.0.jar

      - name: Upload downloadable JAR
        uses: actions/upload-artifact@v4
        with:
          name: redry-nightfall-minecraft-26.3
          path: build/libs/redry-nightfall-0.2.0.jar
          if-no-files-found: error
          retention-days: 30
